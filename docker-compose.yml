services:
  ubersdr_ndb:
    container_name: ndb
    image: madpsy/ubersdr_ndb:latest
    restart: unless-stopped
    cpu_shares: 512
    environment:
      # UberSDR base URL
      UBERSDR_URL: "http://ubersdr:8080"
      # IQ streams to decode, comma-separated "centreHz:mode". Each costs one
      # UberSDR session. Every NDB carrier inside a stream is found and decoded.
      #   iq48  = ±24 kHz   iq96 = ±48 kHz   iq192 = ±96 kHz   iq384 = ±192 kHz
      # (the outer 5% each side is ignored, where the passband rolls off)
      # The default, one iq192 stream at 356 kHz, covers ~270-442 kHz: every
      # NDB in the UK and Ireland in the navaid list except Lichfield (545 kHz).
      # To add Lichfield too (2 sessions, 240 kHz of IQ in total):
      #   NDB_STREAMS: "356000:iq192,545000:iq48"
      # Wide modes (iq192/iq384) may need PASS below.
      NDB_STREAMS: "356000:iq192"
      # Uncomment and set as needed:
      # PASS: ""               # UberSDR bypass password — wide IQ modes usually need one
      # NDB_PINNED: ""         # Hz, comma-separated: always decode these, even unseen
      # NDB_SNR: "10"          # carrier detection threshold, dB above the noise floor
      # NDB_ASSIST_KM: "1500"  # published beacons this close get a lower threshold (7 dB)
      # Most beacons decoded at once, per stream. Each costs CPU; the default
      # stream sees ~40 carriers in the UK (NDBs plus local spurs).
      NDB_MAX_CHANNELS: "48"
      # Radius around the receiver, in km. A decode is only matched to a
      # published beacon inside it (a shared ident on the far side of the
      # world is far more likely a misread), and the map shows unheard
      # beacons out to it. 0 = no limit.
      NDB_RADIUS_KM: "2500"
      # Show idents that match no published beacon on their frequency ("not in
      # database"): mostly misreads or repeating noise, so hidden by default.
      NDB_SHOW_UNLISTED: "0"
      # RECEIVER_LAT: ""       # override the position from UberSDR's /api/description
      # RECEIVER_LON: ""
      # MIN_MARGIN: "26"       # reduced-depth IQ, dB below the band noise (0 = lossless)
      # NDB_LOG_SUMMARY: "120" # log the full beacon table every N seconds (debugging)
      # ggmorse, a second Morse decoder, runs on a small pool of channels at a
      # time: unidentified ones that show some keying. "all" runs it on every
      # channel (~10x the CPU), "off" never.
      # NDB_GGMORSE: "auto"
      # NDB_GGMORSE_SLOTS: "6"   # per stream
      # WEB_PORT: "6100"
    volumes:
      # Heard log (heard.tsv): every beacon ever identified, kept across restarts
      - ./data:/data
    networks:
      - sdr-network
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "ndb"

networks:
  sdr-network:
    external: true
    name: ubersdr_sdr-network
