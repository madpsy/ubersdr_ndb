services:
  ubersdr_ndb:
    container_name: ndb
    image: madpsy/ubersdr_ndb:latest
    restart: unless-stopped
    cpu_shares: 512
    environment:
      # UberSDR base URL
      UBERSDR_URL: "http://ubersdr:8080"
      # IQ streams to decode, comma-separated "centreHz:mode". Each costs one
      # UberSDR session. Every NDB carrier inside a stream is found and decoded.
      #   iq48  = ±24 kHz   iq96 = ±48 kHz   iq192 = ±96 kHz   iq384 = ±192 kHz
      # (the outer 5% each side is ignored, where the passband rolls off)
      # The default covers ~325-411 kHz. To cover the whole European NDB band
      # (roughly 255-526 kHz), for example:
      #   NDB_STREAMS: "300000:iq96,390000:iq96,480000:iq96"
      NDB_STREAMS: "368000:iq96"
      # Uncomment and set as needed:
      # PASS: ""               # UberSDR bypass password — wide IQ modes usually need one
      # NDB_PINNED: ""         # Hz, comma-separated: always decode these, even unseen
      # NDB_SNR: "10"          # carrier detection threshold, dB above the noise floor
      # NDB_ASSIST_KM: "1500"  # published beacons this close get a lower threshold (7 dB)
      # NDB_MAX_CHANNELS: "24" # per stream
      # RECEIVER_LAT: ""       # override the position from UberSDR's /api/description
      # RECEIVER_LON: ""
      # MIN_MARGIN: "26"       # reduced-depth IQ, dB below the band noise (0 = lossless)
      # WEB_PORT: "6100"
    volumes:
      # Heard log (heard.tsv): every beacon ever identified, kept across restarts
      - ./data:/data
    networks:
      - sdr-network
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "ndb"

networks:
  sdr-network:
    external: true
    name: ubersdr_sdr-network
